[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind-kv"
version = "0.1.0"
description = "In-Stream KV-Cache Rollback with Failure Anchors for Reasoning Models"
authors = [{ name = "Giorgio Nicolas de A. Bertino" }]
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.56", "datasets"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
